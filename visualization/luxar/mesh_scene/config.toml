[selection]
fish = [3, 4]
fish_labels = ["Mutant — fish 3", "WT — fish 4"]
cell_type = "pronephric distal early tubule"
qv_min = 20.0
top_genes = 8

[registration]
script3_experiment = "dapi_blend"
script4_experiment = "dapi_blend_rigid_affine_z10"
z_spacing_um = 10.0
xy_pixel_um = 0.2125
fish_crop_margin_px = 10

[appearance]
comparison_gap_um = 250.0
tissue_color = [145, 145, 145]
tissue_opacity = 0.10
tubule_color = [0, 220, 190]
tubule_opacity = 0.78
cell_color = [170, 255, 70]
cell_radius_um = 4.0
transcript_radius_um = 1.5
background_color = "#03060d"

# Stable, saturated colors for the currently selected genes. There is no
# canonical biological color for these genes, so the mapping prioritizes
# visual separation and remains fixed across fish for direct comparison.
[appearance.gene_colors]
hmga1a = [255, 45, 145]  # magenta
mef2ca = [255, 145, 0]   # orange
myod1 = [255, 55, 45]    # vermilion
mef2d = [255, 220, 0]    # yellow
id1 = [45, 220, 90]      # green
xbp1 = [50, 205, 255]    # cyan
sox6 = [55, 95, 255]     # blue
mef2cb = [185, 75, 255]  # purple

[output]
scene_name = "zebrafish_pronephric.luxar.zarr"
