[selection]
fish = [3, 4]
fish_labels = ["Mutant — fish 3", "WT — fish 4"]
cell_type = "pronephric distal early tubule"
genes = ["hmga1a", "mef2ca"]
qv_min = 20.0

[registration]
script3_experiment = "dapi_blend"
script4_experiment = "dapi_blend_rigid_affine_z10"
z_spacing_um = 10.0
xy_pixel_um = 0.2125
fish_crop_margin_px = 10

[image]
channel = "c0.tif"
downsample_zyx = [2, 6, 6]

[fit]
seeds = 6000
iterations = 500
device = "cpu"
preset = "draft"
cull_retention = 0.999
lod_levels = 4

[appearance]
comparison_gap_um = 220.0
background_color = "#02040a"
dapi_colormap = "gray"
dapi_opacity = 0.48
dapi_absorption = 0.45
cell_color = [165, 255, 60]
cell_radius_um = 4.5
transcript_radius_um = 1.8
gene_colors = [[255, 45, 145], [255, 190, 20]]

[output]
scene_name = "zebrafish_image_splats.luxar.zarr"

